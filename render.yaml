services:
  # FastAPI Backend Web Service
  - type: web
    name: ai-interview-backend
    env: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: FRONTEND_ORIGIN
        value: https://ai-interview-frontend.onrender.com
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 120
      - key: CORS_ORIGIN_REGEX
        value: "https://.*\\.onrender\\.com|https://.*\\.vercel\\.app"

  # Vite Frontend Static Site
  - type: web
    name: ai-interview-frontend
    env: static
    region: oregon
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
